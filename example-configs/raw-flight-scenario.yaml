# Raw model input keys map explicitly to CSV headers. Paths are YAML-relative.
simulation:
  duration_s: 0.08
  instructions_per_second: 200000
  random_seed: 0
sources:
  flight:
    kind: openrocket
    csv_path: raw-flight.csv
    time_column: Time (s)
    columns:
      accel_x: Accel X (count)
      accel_y: Accel Y (count)
      accel_z: Accel Z (count)
  built_in: {kind: default}
default_source: built_in
sensors:
  ICM45686: {source: flight}
  BMI088Accel: {source: flight}
