schema_version: 1
mcu:
  model: STM32F407VG
  svd: ../tests/fixtures/svd/stm32f407-minimal.svd
buses:
  SPI1:
    devices:
      - {model: ICM45686, cs: PA4}
      - {model: MS5611, cs: PA5}
      - {model: BMI088Accel, cs: PA6}
outputs:
  telemetry:
    peripheral: USART2
    file: telemetry.bin
    format: raw
    packet_definition: simulated-flight-packet.yaml
  capture:
    file: hardware_events.csv
    sources:
      - {type: gpio, pins: [PB1], mode: transitions}
